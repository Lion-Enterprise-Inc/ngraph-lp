<svg viewBox="0 0 1200 460" width="100%" style="min-width:640px" role="img" aria-label="同じ店の英語ページは、日本語の約5倍の分量になる"><rect x="220" y="268" width="220" height="41" rx="3" fill="#a63a24"/><text x="330" y="250" font-family="'Zen Kaku Gothic New',sans-serif" font-size="46" fill="#a63a24" font-weight="900" text-anchor="middle">7591字</text><text x="330" y="343" font-family="'Zen Kaku Gothic New',sans-serif" font-size="21" fill="#2b2620" font-weight="700" text-anchor="middle">日本語ページ</text><rect x="700" y="99" width="220" height="210" rx="3" fill="#cfc5b4"/><text x="810" y="81" font-family="'Zen Kaku Gothic New',sans-serif" font-size="46" fill="#5c544a" font-weight="900" text-anchor="middle">38510字</text><text x="810" y="343" font-family="'Zen Kaku Gothic New',sans-serif" font-size="21" fill="#2b2620" font-weight="700" text-anchor="middle">英語ページ</text><line x1="570" y1="50" x2="570" y2="358" stroke="#8a8172" stroke-width="1" stroke-dasharray="4 4"/><text x="600.0" y="402.0" font-family="'Zen Old Mincho',serif" font-size="24" fill="#2b2620" font-weight="900" text-anchor="middle">訳した分ではなく、日本語ページに書いていなかった分が増えている</text><text x="8" y="444" font-family="'Zen Kaku Gothic New',sans-serif" font-size="13" fill="#8a8172" font-weight="400" text-anchor="start">出所：当社制作の飲食店サイト1店舗・本文テキスト文字数の実測（2026-08-26）</text></svg>